<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}img{max-width:100%}body{margin:0}</style>
</head>
<body>
<title>Nihol</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap">
<style>
:root{
  --bg:#F1F5EF; --surface:#FFFFFF; --surface-2:#E6ECE3; --ink:#1D2A31; --ink-2:#56666E; --line:#D3DCD0;
  --paper:#FFFFFF;
  --d-jis:#DE5B3A; --d-ijt:#CF4C77; --d-nut:#C58E00; --d-bil:#138A79; --d-ijo:#6F52D1; --d-lang2:#2F6BB8; --d-logo:#2E8B8B; --d-neyro:#5E8C2A; --d-poch:#D9770A; --d-abc:#B23A8A; --d-eng:#4B5BD6; --d-tale:#D9770A;
  --good:#2A8752; --warn:#C08300; --bad:#C2443A;
  --accent:#2B5D84;
  --shadow:0 1px 2px rgba(29,42,49,.06),0 6px 18px rgba(29,42,49,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#11171B; --surface:#1A2227; --surface-2:#232D33; --ink:#E8EEF0; --ink-2:#9AA9B0; --line:#2E3A41;
    --paper:#F3F4EE;
    --d-jis:#F07D5F; --d-ijt:#EB7AA0; --d-nut:#EDBB3C; --d-bil:#3EBFA8; --d-ijo:#9E88F2; --d-lang2:#6FA3E8; --d-logo:#55BDBD; --d-neyro:#8CC152; --d-poch:#F2A93B; --d-abc:#E07BBF; --d-eng:#8F9BFF; --d-tale:#F2A93B;
    --good:#4DBB7B; --warn:#E3AE35; --bad:#EA6F63;
    --accent:#7FB3DA;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#11171B; --surface:#1A2227; --surface-2:#232D33; --ink:#E8EEF0; --ink-2:#9AA9B0; --line:#2E3A41;
  --paper:#F3F4EE;
  --d-jis:#F07D5F; --d-ijt:#EB7AA0; --d-nut:#EDBB3C; --d-bil:#3EBFA8; --d-ijo:#9E88F2; --d-lang2:#6FA3E8; --d-logo:#55BDBD; --d-neyro:#8CC152; --d-poch:#F2A93B; --d-abc:#E07BBF; --d-eng:#8F9BFF; --d-tale:#F2A93B;
  --good:#4DBB7B; --warn:#E3AE35; --bad:#EA6F63;
  --accent:#7FB3DA;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.5 "Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;padding-inline:16px;padding-block:0 40px}
.wrap{max-width:1120px;margin:0 auto}
h1,h2,h3,h4{text-wrap:balance}
.muted{color:var(--ink-2)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* header */
.top{display:flex;flex-wrap:wrap;gap:14px 20px;align-items:center;justify-content:space-between;padding-block:18px 14px}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font-family:"Fredoka","Nunito",sans-serif;font-weight:600;font-size:27px;line-height:1;margin:0}
.brand small{display:block;color:var(--ink-2);font-size:13px;margin-top:3px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:4px;gap:2px}
.seg button{border:0;background:transparent;font-weight:800;padding:8px 16px;border-radius:999px;color:var(--ink-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg.mini button{padding:6px 12px;font-size:13px}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.ctl{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--ink-2);font-weight:800;text-transform:uppercase;letter-spacing:.07em}
select,textarea,input[type=text]{font:inherit;font-size:15px;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-transform:none;letter-spacing:0;font-weight:600}
textarea{width:100%;resize:vertical}
input[type=text]{min-width:0}

/* buttons */
.btn{font-weight:800;border:0;border-radius:14px;padding:12px 22px;background:var(--ink);color:var(--bg);cursor:pointer;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:disabled{opacity:.55;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.btn.sm{padding:8px 14px;font-size:14px;border-radius:12px}
.btn.big{font-size:22px;padding:16px 34px;border-radius:18px;background:var(--c,var(--ink));color:#fff}
.btn.good{background:var(--good);color:#fff}
.btn.danger{background:var(--bad);color:#fff}
.btn.soft{background:var(--surface-2);color:var(--ink)}
.btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:14px}
.row.left{justify-content:flex-start}

/* child home */
.hello{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px;margin-block:10px 20px}
.hello h2{font-family:"Fredoka","Nunito",sans-serif;font-weight:600;font-size:clamp(30px,5vw,44px);margin:0;line-height:1.05}
.hello p{margin:6px 0 0}
.stars{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:18px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 16px 6px 10px;font-variant-numeric:tabular-nums}
.stars svg{width:24px;height:24px;fill:#F2B705}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.tile{--c:var(--ink);position:relative;text-align:left;background:color-mix(in srgb,var(--c) 11%,var(--surface));border:2px solid color-mix(in srgb,var(--c) 28%,transparent);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:10px;cursor:pointer;min-height:200px;transition:transform .15s ease,border-color .15s}
.tile:hover{transform:translateY(-3px);border-color:var(--c)}
.ic{width:56px;height:56px;border-radius:17px;background:var(--c);color:#fff;display:grid;place-items:center;flex:none}
.ic svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:38px;height:38px;border-radius:12px}.ic.sm svg{width:22px;height:22px}
.tile h3{font-family:"Fredoka","Nunito",sans-serif;font-weight:600;font-size:23px;margin:0;line-height:1.1}
.tile p{margin:0;color:var(--ink-2);font-size:14px}
.lv{display:flex;gap:5px;margin-top:auto;align-items:center;font-size:12px;font-weight:800;color:var(--ink-2)}
.lv i{width:22px;height:8px;border-radius:4px;background:color-mix(in srgb,var(--c) 22%,transparent)}
.lv i.on{background:var(--c)}
.lv span{margin-left:6px}
.tag{position:absolute;top:14px;right:14px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;background:var(--c);color:#fff;border-radius:999px;padding:3px 9px}
.note-strip{margin-top:18px;color:var(--ink-2);font-size:14px}
.empty{background:var(--surface);border:2px dashed var(--line);border-radius:24px;padding:40px 20px;text-align:center;max-width:560px;margin:30px auto}
.empty h2{font-family:"Fredoka","Nunito",sans-serif;font-weight:600;font-size:28px;margin:0 0 8px}

/* activity */
.act{--c:var(--ink);background:var(--surface);border-radius:28px;border:1px solid var(--line);box-shadow:var(--shadow);padding:20px clamp(16px,3vw,32px) 26px;max-width:800px;margin:6px auto 0}
.act-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ah-title{display:flex;align-items:center;gap:10px;font-family:"Fredoka","Nunito",sans-serif;font-weight:600;font-size:20px;margin-right:auto}
.steps{display:flex;gap:6px}
.steps i{width:14px;height:14px;border-radius:50%;background:var(--surface-2);border:2px solid color-mix(in srgb,var(--c) 35%,transparent)}
.steps i.done{background:var(--c);border-color:var(--c)}
.steps i.now{border-color:var(--c)}
.pill{font-size:12px;font-weight:800;border-radius:999px;padding:4px 10px;background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--ink);letter-spacing:.03em}
.prompt{font-family:"Fredoka","Nunito",sans-serif;font-weight:600;font-size:clamp(23px,4vw,32px);text-align:center;margin:22px 0 14px;line-height:1.2}
.situation{font-size:clamp(18px,2.6vw,21px);text-align:center;max-width:34ch;margin:0 auto;font-weight:700;background:color-mix(in srgb,var(--c) 9%,var(--surface));border-radius:18px;padding:14px 18px}
.stage{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;align-items:center;min-height:40px}
.objs{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 10px;max-width:520px}
.obj{font-size:44px;line-height:1.25}
.hero-emoji{font-size:110px;line-height:1.2;display:block}
.reveal{width:100%;text-align:center;font-family:"Fredoka","Nunito",sans-serif;font-size:30px;font-weight:600;color:var(--c)}
.opts{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:22px}
.opt{min-width:100px;min-height:84px;border-radius:22px;border:3px solid var(--line);background:var(--surface);font-family:"Fredoka","Nunito",sans-serif;font-weight:600;font-size:34px;cursor:pointer;padding:10px 18px;display:inline-flex;align-items:center;justify-content:center;transition:border-color .12s,transform .12s}
.opt:hover:not(:disabled){border-color:var(--c);transform:translateY(-2px)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 16%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.opt.dim{opacity:.45}
.opts.txt .opt{font-family:"Nunito",sans-serif;font-weight:800;font-size:18px;min-width:min(240px,100%);min-height:64px;flex:1 1 220px;max-width:340px}
.opts.box{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));width:100%;max-width:640px;margin-inline:auto}
.opts.box .opt{width:100%;min-width:0;max-width:none;min-height:160px;padding:12px}
.opts.box .objs{width:100%}
.opts.box .objs .obj{font-size:32px}
.dot{display:inline-block;width:38px;height:38px;border-radius:50%;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
.dot.big{width:52px;height:52px}
.seq{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center}
.q-mark{width:38px;height:38px;border-radius:50%;border:3px dashed var(--ink-2);display:grid;place-items:center;font-weight:800;color:var(--ink-2)}
.feedback{text-align:center;font-weight:800;font-size:19px;min-height:30px;margin:16px 0 0}
.feedback.ok{color:var(--good)}.feedback.no{color:var(--bad)}
.act-foot{display:flex;justify-content:center;margin-top:12px}
.adult{max-width:560px;margin:18px auto 0;border:2px dashed var(--line);border-radius:18px;padding:14px 16px;text-align:center}
.adult h4{margin:0 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2)}
.adult p{margin:0 0 10px}
.mic{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);font-weight:700}
.mic svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.timer{height:14px;border-radius:7px;background:var(--surface-2);overflow:hidden;max-width:420px;margin:10px auto 0}
.timer i{display:block;height:100%;background:var(--c);width:100%;animation:drain var(--t,30s) linear forwards}
@keyframes drain{to{width:0}}
.move{text-align:center}
.move .card{font-family:"Fredoka","Nunito",sans-serif;font-weight:600;font-size:clamp(24px,4vw,34px);background:color-mix(in srgb,var(--c) 12%,var(--surface));border-radius:24px;padding:26px 18px;max-width:520px;margin:0 auto}
.gym{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;max-width:640px;margin:0 auto}
.gym .card{background:color-mix(in srgb,var(--c) 10%,var(--surface));border-radius:20px;padding:16px;text-align:center}
.gym .e{font-size:52px;line-height:1.2;display:block}
.gym h3{font-family:"Fredoka","Nunito",sans-serif;font-weight:600;font-size:22px;margin:6px 0 4px}
.gym p{margin:0;font-size:15px}
.syl{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.syl span{font-family:"Fredoka","Nunito",sans-serif;font-weight:600;font-size:clamp(28px,5vw,40px);background:color-mix(in srgb,var(--c) 12%,var(--surface));border-radius:16px;padding:6px 18px}
.wordcards{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.wordcards div{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:10px 16px;text-align:center;min-width:110px}
.wordcards .e{font-size:44px;line-height:1.25;display:block}
.wordcards b{display:block;font-size:18px;margin-top:4px}
.phrase{font-family:"Fredoka","Nunito",sans-serif;font-weight:600;font-size:clamp(22px,4vw,30px);text-align:center;background:color-mix(in srgb,var(--c) 10%,var(--surface));border-radius:20px;padding:18px 20px;max-width:560px;margin:0 auto}
.pad{width:100%;height:260px;border-radius:20px;background:var(--paper);border:2px solid var(--line);touch-action:none;display:block;cursor:crosshair}
.pad.tall{height:340px}
.pad.neyro{height:320px}
.exp{max-width:620px;margin:0 auto;background:color-mix(in srgb,var(--c) 9%,var(--surface));border-radius:20px;padding:16px 18px}
.exp h4{margin:0 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2)}
.exp p{margin:0 0 10px}
.exp-h{display:flex;gap:12px;align-items:flex-start}
.exp-h .e{font-size:44px;line-height:1.2}
.exp ol{margin:0 0 10px;padding-left:22px;display:grid;gap:4px}
.exp-q{font-family:"Fredoka","Nunito",sans-serif;font-weight:600;font-size:20px;color:var(--c);margin:0!important}
.pad.letter{height:300px}
.abc-hint{display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:800;font-size:18px;color:var(--ink-2)}
.abc-big{font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:clamp(84px,18vw,130px);line-height:1;color:var(--c)}
.vc{display:inline-block;padding:2px 14px;border-radius:999px;color:#fff}
.vc.v{background:#C2443A}.vc.c{background:#2F6BB8}
.pic-word{display:flex;flex-direction:column;align-items:center;gap:6px;line-height:1.2}
.pic-word span{font-size:46px;line-height:1.2}.pic-word b{font-family:"Nunito",sans-serif;font-size:14px;font-weight:800}
.spell{display:flex;flex-direction:column;align-items:center;gap:16px;margin-top:10px}
.boxes{display:flex;gap:8px}
.sbox{width:56px;height:64px;border:3px dashed var(--line);border-radius:14px;display:grid;place-items:center;font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:38px;color:var(--c)}
.sbox.on{border-style:solid;border-color:var(--c);background:color-mix(in srgb,var(--c) 10%,var(--surface))}
.letters{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.lt{min-width:64px;min-height:64px;border-radius:18px;border:3px solid var(--line);background:var(--surface);font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:34px;cursor:pointer;padding:6px 14px}
.lt:hover:not(:disabled){border-color:var(--c)}
.lt.used{opacity:.3}
.lt.shake{border-color:var(--bad);animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.abcmap{display:flex;flex-wrap:wrap;gap:5px}
.abcmap span{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--surface-2);color:var(--ink-2)}
.abcmap span.work{background:color-mix(in srgb,var(--warn) 22%,var(--surface));color:var(--ink)}
.abcmap span.ok{background:color-mix(in srgb,var(--good) 24%,var(--surface));color:var(--ink)}
.dict-card{margin-top:16px;display:flex;align-items:center;gap:16px;width:100%;text-align:left;cursor:pointer;background:color-mix(in srgb,var(--d-eng) 10%,var(--surface));border:2px solid color-mix(in srgb,var(--d-eng) 30%,transparent);border-radius:24px;padding:16px 18px}
.dict-card:hover{border-color:var(--d-eng)}
.dict-card .big{font-family:Georgia,"Times New Roman",serif;font-size:44px;line-height:1.1;color:var(--d-eng);flex:none}
.dict-card h3{margin:0;font-family:"Fredoka","Nunito",sans-serif;font-weight:600;font-size:22px}
.dict-card p{margin:2px 0 0;color:var(--ink-2);font-size:14px}
.abcbar{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:5px;margin:14px 0 6px}
.abcbar button{border:2px solid transparent;border-radius:10px;background:var(--surface-2);font-family:Georgia,"Times New Roman",serif;font-size:19px;font-weight:700;padding:6px 0;cursor:pointer;color:var(--lc)}
.abcbar button[aria-pressed="true"]{background:var(--lc);color:#fff}
.dpage{display:grid;grid-template-columns:auto 1fr;gap:16px 22px;align-items:center;margin-top:12px}
.dletter{font-family:Georgia,"Times New Roman",serif;font-size:clamp(84px,16vw,128px);line-height:1;color:var(--lc);font-weight:400}
.dletter-side{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.dwords{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:12px;margin-top:16px}
.dw{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.dw-top{display:flex;gap:12px;align-items:center}
.dw-name{display:flex;flex-direction:column;align-items:flex-start;gap:5px;min-width:0}
.dw-name .sayrow{justify-content:flex-start}
.dw .e{font-size:58px;line-height:1.25;display:block;flex:none;width:76px;text-align:center}
.ddef{border-top:2px dashed var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.ddef p{margin:0;font-size:16px;line-height:1.45;font-weight:600;overflow-wrap:anywhere}
.ddef p.dtr{color:var(--ink-2);font-weight:700;font-size:15px}
.ddef .sayrow{justify-content:flex-start}
.dw .en{font-family:"Fredoka","Nunito",sans-serif;font-weight:600;font-size:28px;line-height:1.2;color:var(--lc)}
.dw .tr{font-size:17px;font-weight:700;color:var(--ink-2);line-height:1.3}
.sayrow{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.sbtn{border:0;border-radius:999px;background:var(--surface-2);color:var(--ink);font-weight:800;font-size:13px;padding:6px 11px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.sbtn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sbtn.sen{background:color-mix(in srgb,var(--lc) 16%,var(--surface))}
.dex{margin-top:16px;background:color-mix(in srgb,var(--lc) 8%,var(--surface));border-radius:18px;padding:14px 16px}
.dex h4{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2)}
.dex .line{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:4px 0}
.dex .line b{font-family:"Fredoka","Nunito",sans-serif;font-weight:600;font-size:21px}
.dex .line span{font-size:16px;color:var(--ink-2);font-weight:700}
.dnav{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
.en-word{font-family:"Fredoka","Nunito",sans-serif;font-weight:600;font-size:clamp(34px,7vw,52px);line-height:1.2;color:var(--c);display:block;text-align:center}
@media (max-width:560px){.abcbar{grid-template-columns:repeat(7,minmax(0,1fr))}.dpage{grid-template-columns:1fr}}
.qs{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:14px}
.qs li{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:start}
.qs li button{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);background:var(--surface);cursor:pointer;font-size:13px;font-weight:800;color:var(--good);padding:0}
.qs li.done span{text-decoration:line-through;color:var(--ink-2)}
.qs .t{color:var(--ink-2);font-variant-numeric:tabular-nums;font-size:12px;margin-right:6px;text-decoration:none!important}

function tVoice(lang){const code=lang==='ru'?'ru-RU':'uz-UZ';try{const vs=speechSynthesis.getVoices();return {code,v:vs.find(x=>x.lang===code)||vs.find(x=>x.lang&&x.lang.toLowerCase().startsWith(code.slice(0,2))),n:vs.length}}catch(e){return {code,v:null,n:-1}}}
function tSpeak(text,opt){opt=opt||{};const {code,v,n}=tVoice(S.lang);if(n<0||(n&&!v))return false;
  try{const u=new SpeechSynthesisUtterance(text);u.lang=code;if(v)u.voice=v;u.rate=opt.rate||.85;if(opt.pitch)u.pitch=opt.pitch;if(opt.end)u.onend=opt.end;speechSynthesis.cancel();speechSynthesis.speak(u);return true}catch(e){return false}}

function tRead(){

    if(i>=spans.length){S.reading=false;if(btn)btn.innerHTML=SPK+t('readAloud');
      const tale=TALES[S.tale.i];if(S.taleAuto&&S.tale.p<tale.pages.length-1)setTimeout(()=>{if(tok!==S.readTok||S.screen!=='tale')return;S.tale.p++;render();setTimeout(()=>tRead(),900)},1300);return}
    const ok=tSpeak(spans[i].textContent,{end:()=>setTimeout(()=>step(i+1),250)});
    if(!ok){S.reading=false;spans.forEach(s=>s.classList.remove('on'));if(btn)btn.innerHTML=SPK+t('readAloud');const fb=$('#fb');if(fb){fb.textContent=t('noVoiceTale');fb.className='feedback'}}};
  step(0);

/* ---- neuro patterns (unit square, y down); mirrored for the left hand ---- */
const lin=(a,b,n)=>Array.from({length:n},(_,i)=>a+(b-a)*i/(n-1));
const polyd=(pts,step=0.01)=>{const out=[];for(let i=0;i<pts.length-1;i++){const [x0,y0]=pts[i],[x1,y1]=pts[i+1];const d=Math.hypot(x1-x0,y1-y0),n=Math.max(2,Math.floor(d/step));for(let j=0;j<n;j++){const q=j/n;out.push([x0+(x1-x0)*q,y0+(y1-y0)*q])}}out.push(pts[pts.length-1]);return out};
const polar=(fr,n=400)=>lin(0,2*Math.PI,n).map(th=>{const r=fr(th),a=th-Math.PI/2;return [0.5+r*Math.cos(a),0.5+r*Math.sin(a)]});
const PAT=[
  {id:'circle',L:1,uz:'Doira',ru:'Круг',f:()=>lin(-Math.PI/2,1.5*Math.PI,240).map(a=>[0.5+0.4*Math.cos(a),0.5+0.4*Math.sin(a)])},
  {id:'wave',L:1,uz:'To‘lqin',ru:'Волна',f:()=>lin(0,1,240).map(q=>[0.08+0.84*q,0.5+0.2*Math.sin(Math.PI*4*q)])},
  {id:'zigzag',L:1,uz:'Zigzag',ru:'Зигзаг',f:()=>polyd(Array.from({length:7},(_,i)=>[0.1+i*0.8/6,i%2?0.85:0.15]))},
  {id:'steps',L:1,uz:'Zinapoya',ru:'Лесенка',f:()=>{const p=[[0.1,0.9]];let x=0.1,y=0.9;for(let i=0;i<4;i++){x+=0.2;p.push([x,y]);y-=0.2;p.push([x,y])}return polyd(p)}},
  {id:'spiral',L:1,uz:'Spiral',ru:'Спираль',f:()=>lin(0,1,400).map(q=>{const r=0.05+0.37*q,a=Math.PI*6*q;return [0.5+r*Math.cos(a),0.5+r*Math.sin(a)]})},
  {id:'eight',L:2,uz:'Sakkizlik',ru:'Восьмёрка',f:()=>lin(Math.PI/2,Math.PI/2+2*Math.PI,300).map(a=>[0.5+0.3*Math.sin(2*a),0.5+0.42*Math.sin(a)])},
  {id:'flower4',L:2,uz:'Gul (4 barg)',ru:'Цветок (4 лепестка)',f:()=>polar(th=>0.42*Math.cos(2*th))},
  {id:'square',L:2,uz:'Kvadrat labirint',ru:'Квадратный лабиринт',f:()=>polyd([[.08,.08],[.92,.08],[.92,.92],[.08,.92],[.08,.2],[.8,.2],[.8,.8],[.2,.8],[.2,.32],[.68,.32],[.68,.68],[.32,.68],[.32,.44],[.56,.44],[.56,.56]])},
  {id:'cloud',L:2,uz:'Bulutcha',ru:'Облачко',f:()=>polar(th=>0.33+0.07*Math.abs(Math.cos(3*th)))},
  {id:'loops',L:2,uz:'Prujina',ru:'Пружинка',f:()=>lin(0,6*Math.PI,400).map(th=>[0.17+0.035*th-0.13*Math.sin(th),0.5+0.13*Math.cos(th)])},
  {id:'star',L:3,uz:'Yulduz',ru:'Звезда',f:()=>polyd(Array.from({length:6},(_,i)=>{const a=(-90+i*144)*Math.PI/180;return [0.5+0.42*Math.cos(a),0.5+0.42*Math.sin(a)]}))},
  {id:'heart',L:3,uz:'Yurakcha',ru:'Сердечко',f:()=>lin(0,2*Math.PI,300).map(a=>{const x=16*Math.sin(a)**3,y=13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a);return [0.5+x/16*0.4,0.5-(y+2.5)/14.5*0.4]})},
  {id:'tri',L:3,uz:'Uchburchak spiral',ru:'Треугольная спираль',f:()=>{const p=[[0.1,0.85]];let x=0.1,y=0.85,h=0;for(const L of [0.8,0.8,0.68,0.56,0.44,0.32,0.2]){x+=L*Math.cos(h*Math.PI/180);y-=L*Math.sin(h*Math.PI/180);p.push([x,y]);h+=120}return polyd(p)}},
  {id:'flower6',L:3,uz:'Gul (6 barg)',ru:'Цветок (6 лепестков)',f:()=>polar(th=>0.42*Math.abs(Math.cos(3*th)))},
];

function newKid(name,groupId,age){const k={id:uid(),name,groupId,age:age||'5–6',s:{},lvl:{},streak:{},miss:{},stars:0,log:[],gallery:[],note:'',home:{},snd:{},sndStat:{},questions:[],abc:{},eng:{},tales:{}};DOMAINS.forEach(d=>{k.s[d.id]=50;k.lvl[d.id]=1;k.streak[d.id]=0;k.miss[d.id]=0});return k}
function seed(){
  const g1={id:'g1',name:'Quyoncha',lang:'uz',age:'5–6'},g2={id:'g2',name:'Солнышко',lang:'ru',age:'5–6'};
  const rows=[['Madina','g1',62,78,55,70,81,48,50,58],['Jasur','g1',85,48,60,74,52,66,40,72],['Sevara','g1',58,82,79,45,88,40,70,44],['Bobur','g1',77,61,36,66,49,72,35,61],['Oysha','g1',49,70,72,81,67,55,60,39],
    ['Алина','g2',70,64,58,77,72,45,52,66,61,58],['Тимур','g2',88,42,50,60,47,30,38,55,44,36],['Камила','g2',60,80,83,55,86,62,74,48,79,82],['Артём','g2',75,58,40,69,53,50,33,70,57,49]];
  const kids=rows.map(r=>{const k=newKid(r[0],r[1],'5–6');DOMAINS.forEach((d,j)=>{const v=r[j+2]??50;k.s[d.id]=v;k.lvl[d.id]=v<45?1:v<75?2:3});k.stars=Math.round(r.slice(2,7).reduce((a,b)=>a+b,0)/12);
    if(k.s.logo<45){const snd=r[1]==='g1'?['r','sh']:['r','l'];snd.forEach(s=>k.snd[s]='work')}
    return k});
  return {v:1,name:'Nihol',sample:true,groups:[g1,g2],kids};
}
function migrate(d){(d.kids||[]).forEach(k=>{k.snd=k.snd||{};k.sndStat=k.sndStat||{};k.questions=Array.isArray(k.questions)?k.questions:[];k.abc=k.abc||{};k.eng=k.eng||{};k.tales=k.tales||{};k.home=k.home||{};k.gallery=k.gallery||[];k.log=k.log||[];DOMAINS.forEach(x=>{if(k.s[x.id]===undefined){k.s[x.id]=50;k.lvl[x.id]=1;k.streak[x.id]=0;k.miss[x.id]=0}})});return d}
function load(){try{const raw=localStorage.getItem(KEY);if(raw){const d=JSON.parse(raw);if(d&&d.v===1&&Array.isArray(d.groups))return migrate(d)}}catch(e){}return seed()}
let saveT;
function persist(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){
  let trimmed=false;DB.kids.forEach(k=>{if(k.gallery.length){k.gallery=k.gallery.slice(0,2);trimmed=true}});
  try{localStorage.setItem(KEY,JSON.stringify(DB));if(trimmed)toast(t('storageFull'))}catch(e2){}
}}
function save(lazy){clearTimeout(saveT);if(lazy){saveT=setTimeout(persist,300)}else persist()}

/* ================= PROGRESS ================= */
function record(k,d,ok,label){
  k.s[d]=clamp(k.s[d]+(ok?3:-2),0,100);
  let ch=0;
  if(ok){k.stars++;k.streak[d]++;k.miss[d]=0;if(k.streak[d]>=3&&k.lvl[d]<3){k.lvl[d]++;k.streak[d]=0;ch=1}}
  else{k.miss[d]++;k.streak[d]=0;if(k.miss[d]>=2&&k.lvl[d]>1){k.lvl[d]--;k.miss[d]=0;ch=-1}}
  k.log.unshift({t:now(),d,label,ok});if(k.log.length>40)k.log.length=40;
  DB.sample=false;save();
  return ch;
}
let toastT;
function toast(msg){const el=$('#toast');el.textContent=msg;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,2200)}
function say(text,lang,rate){
  const fb=$('#fb');const code=lang==='en'?'en-GB':lang==='ru'?'ru-RU':lang==='uz'?'uz-UZ':cc().tts;
  try{const vs=speechSynthesis.getVoices();const v=vs.find(x=>x.lang===code)||vs.find(x=>x.lang&&x.lang.toLowerCase().startsWith(code.slice(0,2)));
    if(vs.length&&!v){if(fb){fb.textContent=t('noVoice')(text);fb.className='feedback'}return}
    const u=new SpeechSynthesisUtterance(text);u.lang=code;if(v)u.voice=v;u.rate=rate||.8;speechSynthesis.cancel();speechSynthesis.speak(u);
  }catch(e){if(fb){fb.textContent=t('voiceFail')(text);fb.className='feedback'}}
}

function saveUI(){try{localStorage.setItem(KEY+'.ui',JSON.stringify({group:S.group,kid:S.kid,lang:S.lang}))}catch(e){}}

function render(){
  if(S._lastScreen!==S.screen+S.role){const tt=$('#toast');if(tt&&S._lastScreen!==undefined)tt.hidden=true;S._lastScreen=S.screen+S.role}
  if(S.reading&&(S.screen!=='tale'||S.role!=='child'))tStop();
  ensureSel();saveUI();
  document.documentElement.lang=S.lang;

  $('#roles').innerHTML=['child','teacher','parent'].map(r=>`<button data-role="${r}" aria-pressed="${S.role===r}">${t(r)}</button>`).join('');
  $$('#langs button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===S.lang)));
  $('#l-group').textContent=t('group');$('#l-kid').textContent=t('kid');
  $('#group-select').innerHTML=DB.groups.map(g=>`<option value="${g.id}">${esc(g.name)}</option>`).join('');$('#group-select').value=S.group;
  const ks=kidsIn(S.group);$('#kid-select').innerHTML=ks.length?ks.map(k=>`<option value="${k.id}">${esc(k.name)}</option>`).join(''):`<option value="">—</option>`;$('#kid-select').value=S.kid||'';
  $('#foot').textContent=t('foot');
  const m=$('#main');
  if(S.role==='teacher')m.innerHTML=teacherView();
  else if(S.role==='parent')m.innerHTML=K()?parentView():emptyView();
  else if(!K())m.innerHTML=emptyView();

  else if(S.screen==='act')m.innerHTML=actView();

  else m.innerHTML=homeView();
  bind();
}

function radar(k){
  const cx=180,cy=132,R=92,ang=i=>-Math.PI/2+i*2*Math.PI/5;
  const pt=(i,v)=>[cx+Math.cos(ang(i))*R*v/100,cy+Math.sin(ang(i))*R*v/100];
  const poly=v=>CORE.map((_,i)=>pt(i,v).map(n=>n.toFixed(1)).join(',')).join(' ');
  let g=[25,50,75,100].map(v=>`<polygon points="${poly(v)}" fill="none" style="stroke:var(--line)" stroke-width="1"/>`).join('');
  g+=CORE.map((_,i)=>{const [x,y]=pt(i,100);return `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" style="stroke:var(--line)"/>`}).join('');
  const data=CORE.map((d,i)=>pt(i,k.s[d.id]).map(n=>n.toFixed(1)).join(',')).join(' ');
  g+=`<polygon points="${data}" style="fill:var(--accent);fill-opacity:.18;stroke:var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>`;
  g+=CORE.map((d,i)=>{const [x,y]=pt(i,k.s[d.id]);return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="5" style="fill:var(--d-${d.id});stroke:var(--surface)" stroke-width="2"/>`}).join('');
  g+=`<text x="${cx+4}" y="${cy-R/2+4}" class="val" style="font-size:10px">50</text>`;
  g+=CORE.map((d,i)=>{const a=ang(i),rr=R+16;const x=cx+Math.cos(a)*rr,y=cy+Math.sin(a)*rr;const c=Math.cos(a);const anchor=Math.abs(c)<.2?'middle':c>0?'start':'end';const dy=Math.sin(a)<-.5?-8:Math.sin(a)>.5?10:0;
    return `<text x="${x.toFixed(1)}" y="${(y+dy).toFixed(1)}" text-anchor="${anchor}">${dn(d)}</text><text x="${x.toFixed(1)}" y="${(y+dy+15).toFixed(1)}" text-anchor="${anchor}" class="val">${k.s[d.id]}</text>`}).join('');
  return `<svg class="radar" viewBox="0 0 360 270" role="img" aria-label="${esc(k.name)}: ${CORE.map(d=>dn(d)+' '+k.s[d.id]).join(', ')}">${g}</svg>`;
}

function startAct(d){S.screen='act';S.act={d,i:0,total:DOM(d).round,correct:0,answered:false,q:null};nextQ()}
function nextQ(){const a=S.act;if(a.i>=a.total){S.screen='done';render();return}a.q=GEN[a.d](K(),a.i);a.answered=false;render();window.scrollTo({top:0,behavior:'smooth'})}
function finish(ok,label,msg){
  const a=S.act;if(a.answered)return;a.answered=true;
  const k=K(),ch=record(k,a.d,ok,label||a.q.label);if(ok)a.correct++;
  if(a.q.letter){k.abc=k.abc||{};const r=k.abc[a.q.letter]||(k.abc[a.q.letter]={t:0,ok:0});r.t++;if(ok)r.ok++;save()}
  if(a.q.snd){const id=a.q.snd.id;const r=k.sndStat[id]||(k.sndStat[id]={t:0,ok:0});r.t++;if(ok)r.ok++;if(!k.snd[id])k.snd[id]='work';if(r.t>=6&&r.ok/r.t>=.8)k.snd[id]='ok';save()}
  const fb=$('#fb');fb.textContent=ok?(msg||(a.q.okMsg?pick(cc().PRAISE)+' '+a.q.okMsg:pick(cc().PRAISE))):(msg||a.q.explain||'');fb.className='feedback '+(ok?'ok':'no');
  if(a.q.reveal){const st=$('#stage');if(st)st.insertAdjacentHTML('beforeend',`<div class="reveal">${a.q.reveal}</div>`)}
  if(a.q.speakAfter&&('speechSynthesis' in window))say(a.q.speakAfter,a.q.speakLang2||a.q.speakLang);
  if(a.q.engWord){k.eng=k.eng||{};const r=k.eng[a.q.engWord]||(k.eng[a.q.engWord]={t:0,ok:0});r.t++;if(ok)r.ok++;save()}
  $('#lvl-pill').textContent=`${t('difficulty')} ${k.lvl[a.d]}/3`;
  if(ch>0)toast(t('lvlUp'));if(ch<0)toast(t('lvlDown'));
  const n=$('#next');n.hidden=false;n.focus();
}

function interp(a,b,out){const d=Math.hypot(b.x-a.x,b.y-a.y),n=Math.floor(d/4);for(let i=1;i<=n;i++)out.push({x:a.x+(b.x-a.x)*i/(n+1),y:a.y+(b.y-a.y)*i/(n+1)})}
function setupPad(kind,guidePts){
  const cv=$('#pad');if(!cv)return null;
  const dpr=window.devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;
  cv.width=w*dpr;cv.height=h*dpr;const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);ctx.lineCap='round';ctx.lineJoin='round';
  const traceColor=getComputedStyle(document.documentElement).getPropertyValue('--d-jis').trim()||'#DE5B3A';
  const abcColor=getComputedStyle(document.documentElement).getPropertyValue('--d-abc').trim()||'#B23A8A';
  let guide=[],user=[],drawing=false,last=null,color=kind==='trace'?traceColor:kind==='elem'?abcColor:'#2B3A44',size=kind!=='draw'?10:7;
  if(kind==='trace'){const L=K().lvl.jis;for(let s=0;s<=1.0001;s+=0.01){const x=30+s*(w-60);let y;
      if(L===1)y=h/2+Math.sin(s*Math.PI*2)*h*.14;else if(L===2)y=h/2+Math.sin(s*Math.PI*4)*h*.26;else{const p=(s*5)%1;y=h/2+(p<.5?p*4-1:3-p*4)*h*.3}
      guide.push({x,y})}}
  else if(kind==='elem'&&guidePts){guide=polyd(guidePts,0.008).map(([gx,gy])=>({x:30+gx*(w-60),y:16+gy*(h-32)}))}
  function paper(){ctx.fillStyle='#FFFFFF';ctx.fillRect(0,0,w,h);
    if(guide.length){ctx.save();ctx.setLineDash([2,14]);ctx.strokeStyle='#9DB0BA';ctx.lineWidth=12;ctx.beginPath();guide.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke();ctx.restore();
      const s=guide[0],e=guide[guide.length-1];ctx.fillStyle='#3FA34D';ctx.beginPath();ctx.arc(s.x,s.y,11,0,7);ctx.fill();ctx.fillStyle='#E9B200';ctx.beginPath();ctx.arc(e.x,e.y,11,0,7);ctx.fill()}}
  paper();
  const pos=e=>{const r=cv.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}};
  cv.addEventListener('pointerdown',e=>{drawing=true;try{cv.setPointerCapture(e.pointerId)}catch(_){}last=pos(e);user.push(last);ctx.fillStyle=color;ctx.beginPath();ctx.arc(last.x,last.y,size/2,0,7);ctx.fill()});
  cv.addEventListener('pointermove',e=>{if(!drawing)return;const p=pos(e);ctx.strokeStyle=color;ctx.lineWidth=size;ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();interp(last,p,user);user.push(p);last=p});
  const up=()=>{drawing=false};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);cv.addEventListener('pointerleave',up);
  return {
    clear(){user=[];paper()},
    set(c){if(c==='eraser'){color='#FFFFFF';size=26}else{color=c;size=7}},
    score(){if(!user.length)return {cov:0,acc:0};const near=(a,b,r)=>(a.x-b.x)**2+(a.y-b.y)**2<r*r;
      const cov=guide.filter(g=>user.some(u=>near(g,u,22))).length/guide.length;const acc=user.filter(u=>guide.some(g=>near(g,u,26))).length/user.length;return {cov,acc}},
    count(){return user.length},
    data(){const c=document.createElement('canvas');c.width=200;c.height=Math.round(200*h/w);c.getContext('2d').drawImage(cv,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.7)},
  };
}

function setupLetterPad(letter){
  const cv=$('#pad');if(!cv)return null;
  const dpr=window.devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;
  cv.width=w*dpr;cv.height=h*dpr;const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);ctx.lineCap='round';ctx.lineJoin='round';
  const col=getComputedStyle(document.documentElement).getPropertyValue('--d-abc').trim()||'#B23A8A';
  const fs=Math.min(h*0.8,w*0.55),font=`bold ${fs}px Arial, Helvetica, sans-serif`,cx=w/2,cy=h/2+fs*0.04;
  const off=document.createElement('canvas');off.width=w;off.height=h;const o=off.getContext('2d');o.font=font;o.textAlign='center';o.textBaseline='middle';o.fillStyle='#000';o.fillText(letter,cx,cy);
  const img=o.getImageData(0,0,w,h).data,cell=6,cells=new Set(),guide=[];
  for(let y=cell/2;y<h;y+=cell)for(let x=cell/2;x<w;x+=cell){if(img[((y|0)*w+(x|0))*4+3]>60){cells.add(((y/cell)|0)*1000+((x/cell)|0));guide.push({x,y})}}
  const inLetter=p=>{const gx=(p.x/cell)|0,gy=(p.y/cell)|0;for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)if(cells.has((gy+dy)*1000+gx+dx))return true;return false};
  let user=[],drawing=false,last=null;const lw=Math.max(14,fs*0.085);
  function paper(){ctx.fillStyle='#FFFFFF';ctx.fillRect(0,0,w,h);ctx.font=font;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillStyle='#EEF2F0';ctx.fillText(letter,cx,cy);ctx.save();ctx.setLineDash([6,8]);ctx.lineWidth=3;ctx.strokeStyle='#9DB0BA';ctx.strokeText(letter,cx,cy);ctx.restore();
    if(guide.length){const top=guide.reduce((a,b)=>b.y<a.y||(b.y===a.y&&b.x<a.x)?b:a);ctx.fillStyle='#3FA34D';ctx.beginPath();ctx.arc(top.x,top.y+6,8,0,7);ctx.fill()}}
  paper();
  const pos=e=>{const r=cv.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}};
  cv.addEventListener('pointerdown',e=>{drawing=true;try{cv.setPointerCapture(e.pointerId)}catch(_){}last=pos(e);user.push(last);ctx.fillStyle=col;ctx.beginPath();ctx.arc(last.x,last.y,lw/2,0,7);ctx.fill()});
  cv.addEventListener('pointermove',e=>{if(!drawing)return;const p=pos(e);ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();interp(last,p,user);user.push(p);last=p});
  const up=()=>{drawing=false};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);cv.addEventListener('pointerleave',up);
  return {
    clear(){user=[];paper()},count(){return user.length},
    score(){if(!user.length||!guide.length)return {cov:0,acc:0};const r2=(lw*0.9)**2;
      const cov=guide.filter(g=>user.some(u=>(g.x-u.x)**2+(g.y-u.y)**2<r2)).length/guide.length;const acc=user.filter(inLetter).length/user.length;return {cov,acc}},
  };
}

function setupNeuroPad(pat){
  const cv=$('#pad');if(!cv)return null;
  const dpr=window.devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;
  cv.width=w*dpr;cv.height=h*dpr;const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);ctx.lineCap='round';ctx.lineJoin='round';
  const css=getComputedStyle(document.documentElement);
  const gap=Math.max(18,w*0.06),s=Math.min((w-gap)/2-14,h-24);
  const rect={L:{x:w/2-gap/2-s,y:(h-s)/2},R:{x:w/2+gap/2,y:(h-s)/2}};
  const base=pat.f();
  const guide={L:base.map(([x,y])=>({x:rect.L.x+(1-x)*s,y:rect.L.y+y*s})),R:base.map(([x,y])=>({x:rect.R.x+x*s,y:rect.R.y+y*s}))};
  const user={L:[],R:[]},ptrs=new Map(),lw=Math.max(14,s*0.075);
  const col={L:css.getPropertyValue('--d-neyro').trim()||'#5E8C2A',R:css.getPropertyValue('--d-lang2').trim()||'#2F6BB8'};
  function paper(){ctx.fillStyle='#FFFFFF';ctx.fillRect(0,0,w,h);
    ctx.save();ctx.setLineDash([4,8]);ctx.strokeStyle='#D3DCD0';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(w/2,8);ctx.lineTo(w/2,h-8);ctx.stroke();ctx.restore();
    for(const side of ['L','R']){const g=guide[side];ctx.save();ctx.setLineDash([2,14]);ctx.strokeStyle='#9DB0BA';ctx.lineWidth=lw;ctx.beginPath();g.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke();ctx.restore();
      const a=g[0],b=g[g.length-1];ctx.fillStyle='#3FA34D';ctx.beginPath();ctx.arc(a.x,a.y,lw*.6,0,7);ctx.fill();ctx.fillStyle='#E9B200';ctx.beginPath();ctx.arc(b.x,b.y,lw*.4,0,7);ctx.fill()}}
  paper();
  const pos=e=>{const r=cv.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}};
  cv.addEventListener('pointerdown',e=>{const p=pos(e),side=p.x<w/2?'L':'R';ptrs.set(e.pointerId,{side,last:p});try{cv.setPointerCapture(e.pointerId)}catch(_){}user[side].push(p);ctx.fillStyle=col[side];ctx.beginPath();ctx.arc(p.x,p.y,lw*.3,0,7);ctx.fill()});
  cv.addEventListener('pointermove',e=>{const st=ptrs.get(e.pointerId);if(!st)return;const p=pos(e);ctx.strokeStyle=col[st.side];ctx.lineWidth=lw*.6;ctx.beginPath();ctx.moveTo(st.last.x,st.last.y);ctx.lineTo(p.x,p.y);ctx.stroke();interp(st.last,p,user[st.side]);user[st.side].push(p);st.last=p});
  const up=e=>ptrs.delete(e.pointerId);cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
  return {
    clear(){user.L=[];user.R=[];paper()},
    count(){return user.L.length+user.R.length},
    score(){const near=(a,b,r)=>(a.x-b.x)**2+(a.y-b.y)**2<r*r;const res={};
      for(const side of ['L','R']){const g=guide[side],u=user[side];if(!u.length){res[side]={cov:0,acc:0};continue}
        const cov=g.filter(p=>u.some(q=>near(p,q,s*.09))).length/g.length;const acc=u.filter(q=>g.some(p=>near(p,q,s*.11))).length/u.length;res[side]={cov,acc}}
      return res},
  };
}

/* ================= EXPORT / IMPORT ================= */
function exportData(){
  const blob=new Blob([JSON.stringify(DB)],{type:'application/json'});const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=`${(DB.name||'nihol').toLowerCase()}-${new Date().toISOString().slice(0,10)}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);
}
function importData(file){
  const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||d.v!==1||!Array.isArray(d.groups)||!Array.isArray(d.kids))throw 0;DB=migrate(d);S.group=null;S.kid=null;save();toast(t('imported'));render()}catch(e){toast(t('importBad'))}};r.readAsText(file);
}

/* ================= BINDING ================= */
const on=(sel,ev,fn)=>{const el=$(sel);if(el)el[ev]=fn};
function bind(){
  $$('#roles button').forEach(b=>b.onclick=()=>{S.role=b.dataset.role;S.screen='home';S.editKid=false;S.confirm=null;render()});
  $$('[data-go]').forEach(b=>b.onclick=()=>startAct(b.dataset.go));
  on('#go-teacher','onclick',()=>{S.role='teacher';render()});
  on('#open-tales','onclick',()=>{S.screen='tales';render();window.scrollTo({top:0})});
  bindTale();
  on('#open-dict','onclick',()=>{S.screen='dict';S.dictI=S.dictI||0;render();window.scrollTo({top:0})});
  if(S.screen==='dict'){$$('[data-dl]').forEach(b=>b.onclick=()=>{S.dictI=+b.dataset.dl;render()});on('#dict-prev','onclick',()=>{S.dictI--;render()});on('#dict-next','onclick',()=>{S.dictI++;render()})}
  $$('[data-say]').forEach(b=>b.onclick=()=>say(b.dataset.say,b.dataset.lang,b.dataset.rate?+b.dataset.rate:undefined));
  on('#back','onclick',()=>{S.screen='home';render()});
  on('#next','onclick',()=>{S.act.i++;nextQ()});
  on('#again','onclick',()=>startAct(S.act.d));
  on('#home','onclick',()=>{S.screen='home';render()});
  if(S.role==='child'&&S.screen==='act'&&K()){
    const q=S.act.q;
    $$('.opt').forEach(b=>b.onclick=()=>{
      if(S.act.answered)return;const o=q.opts[+b.dataset.j];
      $$('.opt').forEach((x,j)=>{x.disabled=true;if(q.opts[j].ok)x.classList.add('right');else if(x!==b)x.classList.add('dim')});
      if(!o.ok)b.classList.add('wrong');finish(o.ok);
    });
    on('#speak','onclick',()=>say(q.speak,q.speakLang));
    if(q.autoSpeak&&!q._spoken&&('speechSynthesis' in window)){q._spoken=1;say(q.speak,q.speakLang)}
    const so=$('#say-ok'),sn=$('#say-no');
    if(so){const lock=()=>{so.disabled=true;sn.disabled=true};
      so.onclick=()=>{lock();finish(true,null,q.kind==='say'?t('sayOk'):q.kind==='gym'?t('gymOk'):q.kind==='exp'?null:t('sndOk')(q.snd.ch))};
      sn.onclick=()=>{lock();finish(false,null,q.kind==='say'?t('sayNo')(q.word):q.kind==='gym'?'':q.kind==='exp'?t('expNo'):t('sndNo')(q.snd.ch))}}
    on('#ask-save','onclick',()=>{const v=$('#ask-text').value.trim();const fb=$('#fb');if(!v){fb.textContent=t('askEmpty');fb.className='feedback';$('#ask-text').focus();return}
      const k=K();k.questions=k.questions||[];k.questions.unshift({t:now(),q:v,done:false});if(k.questions.length>30)k.questions.length=30;$('#ask-save').disabled=true;$('#ask-skip').disabled=true;$('#ask-text').disabled=true;finish(true,t('pochAsk')+': '+v.slice(0,40),t('askOk'))});
    on('#ask-skip','onclick',()=>{$('#ask-save').disabled=true;$('#ask-skip').disabled=true;skipStep(t('askSkipped'))});
    on('#move-done','onclick',()=>{$('#move-done').disabled=true;finish(true,null,t('moveOk'))});
    if(q.kind==='neyro'){
      const pad=setupNeuroPad(q.pat);
      on('#pad-clear','onclick',()=>pad.clear());
      on('#neyro-check','onclick',()=>{const fb=$('#fb');const r=pad.score();
        if(pad.count()<5||!r.L.cov||!r.R.cov){fb.textContent=t('neyroBoth');fb.className='feedback';return}
        const l=Math.round(r.L.cov*100),rr=Math.round(r.R.cov*100);const ok=r.L.cov>=.6&&r.R.cov>=.6&&r.L.acc>=.5&&r.R.acc>=.5;
        $('#neyro-check').disabled=true;$('#pad-clear').disabled=true;finish(ok,null,ok?t('neyroOk')(l,rr):t('neyroNo')(l,rr))});
    }
    if(q.kind==='spell'){let pos=0,mist=0;const boxes=$$('#spell .sbox');
      $$('#spell .lt').forEach(b=>b.onclick=()=>{if(S.act.answered)return;const ch=b.dataset.ch;
        if(ch===q.word[pos]){boxes[pos].textContent=ch;boxes[pos].classList.add('on');b.disabled=true;b.classList.add('used');pos++;const fb=$('#fb');fb.textContent='';
          if(pos>=q.word.length){const ok=mist<=1;$$('#spell .lt').forEach(x=>x.disabled=true);finish(ok,null,ok?t('abcSpellOk')(q.word):t('abcSpellNo')(q.word,mist))}}
        else{mist++;b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),400);const fb=$('#fb');fb.textContent=t('abcSpellHint')(q.word[pos]);fb.className='feedback'}})}
    if(q.kind==='trace'||q.kind==='draw'||q.kind==='elem'||q.kind==='letter'){
      const pad=q.kind==='letter'?setupLetterPad(q.letter):setupPad(q.kind,q.guide);
      on('#pad-clear','onclick',()=>pad.clear());
      on('#trace-check','onclick',()=>{if(pad.count()<5){const fb=$('#fb');fb.textContent=t('traceFirst');fb.className='feedback';return}
        const {cov,acc}=pad.score();const th=q.kind==='letter'?[.5,.6]:q.kind==='elem'?[.65,.6]:[.7,.6];const ok=cov>=th[0]&&acc>=th[1];$('#trace-check').disabled=true;$('#pad-clear').disabled=true;
        const pc=Math.round(cov*100);finish(ok,null,q.kind==='letter'?(ok?t('abcLetterOk')(pc):cov>=th[0]?t('abcLetterOut'):t('abcLetterNo')(pc)):(ok?t('traceOk')(pc):t('traceNo')(pc)))});
      $$('.sw').forEach(s=>s.onclick=()=>{$$('.sw').forEach(x=>x.setAttribute('aria-pressed','false'));s.setAttribute('aria-pressed','true');pad.set(s.dataset.color)});
      on('#draw-save','onclick',()=>{if(pad.count()<3){const fb=$('#fb');fb.textContent=t('drawFirst');fb.className='feedback';return}
        const k=K();k.gallery.unshift({src:pad.data(),theme:q.prompt,t:now()});if(k.gallery.length>6)k.gallery.length=6;$('#draw-save').disabled=true;finish(true,q.label+': '+q.prompt,t('drawSaved'))});

  if(S.role==='teacher'){

    on('#play-as','onclick',()=>{S.role='child';S.screen='home';render()});
    on('#edit-kid','onclick',()=>{S.editKid=!S.editKid;S.confirm=null;render()});

    on('#ek-del','onclick',()=>{S.confirm='kid';render()});
    on('#ek-del-no','onclick',()=>{S.confirm=null;render()});
    on('#ek-del-yes','onclick',()=>{DB.kids=DB.kids.filter(x=>x.id!==k.id);S.kid=null;S.editKid=false;S.confirm=null;DB.sample=false;save();render()});
    on('#note','oninput',()=>{k.note=$('#note').value;DB.sample=false;save(true)});
    $$('[data-qdone]').forEach(b=>b.onclick=()=>{const x=(k.questions||[])[+b.dataset.qdone];if(!x)return;x.done=!x.done;DB.sample=false;save();render()});
    $$('[data-snd]').forEach(b=>b.onclick=()=>{const id=b.dataset.snd;const cur=k.snd[id]||'';k.snd[id]=cur===''?'work':cur==='work'?'ok':'';if(!k.snd[id])delete k.snd[id];DB.sample=false;save();render()});
    const addKid=()=>{const n=$('#nk-name').value.trim();if(!n)return;const nk=newKid(n,g.id,$('#nk-age').value);DB.kids.push(nk);S.kid=nk.id;DB.sample=false;save();render()};
    on('#nk-add','onclick',addKid);on('#nk-name','onkeydown',e=>{if(e.key==='Enter')addKid()});
    on('#g-save','onclick',()=>{const n=$('#g-name').value.trim();if(n)g.name=n;g.lang=$('#g-lang').value;g.age=$('#g-age').value;const pn=$('#p-name').value.trim();if(pn)DB.name=pn;S.lang=g.lang;DB.sample=false;save();render()});
    on('#g-new','onclick',()=>{const ng={id:uid(),name:S.lang==='ru'?`Группа ${DB.groups.length+1}`:`${DB.groups.length+1}-guruh`,lang:S.lang,age:'5–6'};DB.groups.push(ng);S.group=ng.id;S.kid=null;DB.sample=false;save();render()});
    on('#g-del','onclick',()=>{S.confirm='group';render()});
    on('#g-del-no','onclick',()=>{S.confirm=null;render()});
    on('#g-del-yes','onclick',()=>{DB.groups=DB.groups.filter(x=>x.id!==g.id);S.group=null;S.kid=null;S.confirm=null;DB.sample=false;save();render()});
    on('#exp','onclick',exportData);
    on('#imp','onchange',e=>{if(e.target.files[0])importData(e.target.files[0])});
    on('#reset','onclick',()=>{S.confirm='reset';render()});
    on('#reset-no','onclick',()=>{S.confirm=null;render()});
    on('#reset-yes','onclick',()=>{DB={v:1,name:DB.name,sample:false,groups:[],kids:[]};S.group=null;S.kid=null;S.confirm=null;save();render()});
  }
  $$('[data-home]').forEach(c=>c.onchange=()=>{K().home[c.dataset.home]=c.checked;c.closest('li').classList.toggle('checked',c.checked);save()});
}
